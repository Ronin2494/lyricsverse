name: Browser and accessibility QA
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production build
        run: npm run build
      - name: Install browser tooling without changing application dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1 axe-core@4.10.3
      - name: Install Chromium browser
        run: npx playwright install chromium
      - name: Browser route and form smoke with local isolated API and Firebase fixtures
        run: node qa/browser-smoke.mjs
      - name: Upload screenshots, accessibility and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyricverse-browser-qa
          path: qa-results/
          if-no-files-found: warn
          retention-days: 14
