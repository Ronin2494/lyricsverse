<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LyricVerse Admin — Lyrics</title><link rel="stylesheet" href="./styles.css"><style>body{background:#090f22;color:#f8fafc;font:16px Inter,system-ui,sans-serif}main{max-width:960px;margin:45px auto;padding:24px}h1{font-size:32px}section{background:#111a30;border:1px solid #344260;border-radius:18px;padding:24px;margin:20px 0}label{display:grid;gap:7px;margin:12px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #657696;border-radius:9px;background:#090f22;color:#fff;font:inherit}textarea{min-height:260px}button{background:#a17aff;color:#090f22;padding:12px 20px;border:0;border-radius:9px;font-weight:700;cursor:pointer}button:hover{background:#c3adff}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.check{display:flex;align-items:start;gap:12px}.check input{width:auto;margin-top:5px}a{color:#64e6e7}#notice{min-height:24px;color:#64e6e7}@media(max-width:650px){.fields{grid-template-columns:1fr}main{margin:12px auto;padding:12px}}body{background:radial-gradient(ellipse at 85% 12%,rgba(151,54,242,.22),transparent 55%),radial-gradient(ellipse at 10% 78%,rgba(36,106,255,.18),transparent 65%),#050a20!important;color:#f8faff}main{max-width:1120px}h1{font-size:clamp(34px,4.5vw,60px);letter-spacing:-.055em;background:linear-gradient(90deg,#fff,#f0a8ff 70%,#8edcff);background-clip:text;-webkit-background-clip:text;color:transparent}section{background:linear-gradient(145deg,rgba(30,42,91,.9),rgba(8,15,43,.95));border:1px solid rgba(143,153,255,.32);border-radius:24px;box-shadow:0 22px 64px rgba(0,2,26,.55),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(12px)}button{background:linear-gradient(100deg,#ec82f4,#a87bff 54%,#74d7ff);color:#07102c;border-radius:999px;box-shadow:0 10px 32px rgba(150,74,241,.3)}input,select,textarea{background:#0b1636;border:1px solid #52649b;border-radius:12px}input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #75eaff;outline-offset:2px}#notice{color:#9cf3ff;font-weight:650}@media(prefers-reduced-motion:reduce){button{transition:none}}</style></head><body><main><a href="./">← Back to LyricVerse</a><h1>Lyrics administration</h1><p>Add original or licensed lyrics in any language and genre. Only publish content you have permission to display.</p><section id="login"><form><label>Admin access key<input id="key" type="password" autocomplete="off" required></label><button type="submit">Unlock editor</button></form></section><div id="editor" hidden><button type="button" id="logout">Lock editor</button><section><h2>Add lyrics</h2><form id="lyrics-form"><div class="fields"><label>Song title<input name="title" maxlength="200" required></label><label>Artist<input name="artist" maxlength="200" required></label><label>Genre<input name="genre" list="genres" required><datalist id="genres"><option>Pop</option><option>Rock</option><option>Hip-Hop</option><option>R&B</option><option>Classical</option><option>Folk</option><option>Devotional</option><option>Electronic</option><option>Jazz</option><option>Country</option><option>Indie</option></datalist></label><label>Language code (BCP 47)<input name="language" placeholder="en, hi, pa, es, fr" pattern="[a-zA-Z]{2,8}(-[a-zA-Z0-9]{2,8})*" required></label></div><label>Song thumbnail URL (optional, HTTPS image)<input name="thumbnailUrl" type="url" maxlength="1000" placeholder="https://example.com/song-cover.jpg"></label><label>Lyrics<textarea name="lyrics" maxlength="50000" required></textarea></label><label>Rights evidence or permission reference<input name="rightsReference" maxlength="500" placeholder="Original composition / license agreement reference"></label><label class="check"><input type="checkbox" id="rightsConfirmed">I confirm I own these lyrics or have permission to publish them.</label><label class="check"><input type="checkbox" name="featuredOwnComposition" id="featuredOwnComposition" disabled>Feature this original composition in the homepage floater (Deepak or Deepak Sharma only).</label><p id="feature-hint">Enter an eligible artist to enable this option.</p><label>Access tier<select name="accessTier"><option value="free">Free</option><option value="premium">Premium</option></select></label><label>Visibility<select name="status"><option value="draft">Save as draft</option><option value="published">Publish</option></select></label><button type="submit">Save lyrics</button></form></section><section><h2>Recent entries</h2><ul id="items"></ul></section></div><p id="notice" role="status" aria-live="polite"></p></main><script type="module" src="./src/admin.js"></script></body></html>
